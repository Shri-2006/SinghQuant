name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Same recipe as setup.sh: compatible ranges, CPU torch, alpaca without
        # its stale dependency pins. 3.11 additionally verifies the pinned set.
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
            python -m pip install -r requirements-py311-pinned.txt
          else
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
            python -m pip install -r requirements.txt
          fi
          python -m pip install "alpaca-trade-api==3.0.0" --no-deps
          python -m pip install msgpack websocket-client PyYAML deprecation aiohttp "websockets>=10"

      - name: Run tests
        run: python -m pytest tests/ -q --deselect tests/test_regime.py::TestVIXSignal::test_get_vix_returns_float_or_none
        env:
          POLYGON_API_KEY: test_key
          ALPACA_API_KEY: test_key
          ALPACA_SECRET_KEY: test_key

# Dummy keys: tests never call external APIs. The one network-dependent test
# (live VIX fetch from FRED) is deselected so CI cannot fail on connectivity.
