name: Run Tests

on:
  push:
    # Every branch, so work branches (audit-hardening, claude-remediation, ...)
    # are tested before they are proposed for main.
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    # ubuntu-24.04-arm is GitHub's native ARM64 (Ampere-class) runner, free for
    # public repositories: the same CPU architecture as the Oracle Cloud host.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Same recipe as setup.sh. 3.11 verifies the original pinned set (torch
        # from the CPU index); 3.12 verifies the split compatible-range files.
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            bash setup.sh --pinned --with-rl
          else
            bash setup.sh --all
          fi

      - name: Run tests
        run: python -m pytest tests/ -q --deselect tests/test_regime.py::TestVIXSignal::test_get_vix_returns_float_or_none
        env:
          POLYGON_API_KEY: test_key
          ALPACA_API_KEY: test_key
          ALPACA_SECRET_KEY: test_key

  docker-image:
    # Builds the production image natively on amd64 and arm64. The build itself
    # runs tools/smoke_imports.py; the full test suite then runs INSIDE the image.
    # Nothing is pushed anywhere and no credentials are used.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          touch .env
          docker compose config --quiet

      - name: Build image
        run: docker build --tag singhquant:ci .

      - name: Report platform and versions
        run: docker run --rm singhquant:ci sh -c 'uname -m && python -m tools.smoke_imports --require-rl && pip freeze | grep -iE "^(torch|numpy|xgboost|pandas|websockets|aiohttp)=="'

      - name: Run the test suite inside the image
        run: >
          docker run --rm --network none
          -e POLYGON_API_KEY=test_key -e ALPACA_API_KEY=test_key -e ALPACA_SECRET_KEY=test_key
          singhquant:ci python -m pytest tests/ -q -p no:cacheprovider
          --deselect tests/test_regime.py::TestVIXSignal::test_get_vix_returns_float_or_none

# Dummy keys: tests never call external APIs. The one network-dependent test
# (live VIX fetch from FRED) is deselected so CI cannot fail on connectivity.
