name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Same recipe as setup.sh. 3.11 verifies the original pinned set (torch
        # from the CPU index); 3.12 verifies the split compatible-range files.
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            bash setup.sh --pinned --with-rl
          else
            bash setup.sh --all
          fi

      - name: Run tests
        run: python -m pytest tests/ -q --deselect tests/test_regime.py::TestVIXSignal::test_get_vix_returns_float_or_none
        env:
          POLYGON_API_KEY: test_key
          ALPACA_API_KEY: test_key
          ALPACA_SECRET_KEY: test_key

# Dummy keys: tests never call external APIs. The one network-dependent test
# (live VIX fetch from FRED) is deselected so CI cannot fail on connectivity.
